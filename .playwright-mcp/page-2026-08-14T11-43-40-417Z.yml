  - paragraph [ref=f11e72]:
    - text: The authored layer is the trust boundary. Nothing in the corpus says what
    - code [ref=f11e73]: Z10075
    - text: means; those definitions are a claim about Wikifunctions that F* cannot check. What F* checks is that the definitions are total, terminate, and typecheck. What checks the claim is the tester sweep below.
  - paragraph [ref=f11e74]: Both layers were produced with LLM assistance. That is not the useful distinction. The useful distinction is that the generated layer can be regenerated from pinned data and will change when the data changes, while the authored layer cannot and will not.
  - heading "How it is checked, and why it is split up" [level=2] [ref=f11e75]
  - paragraph [ref=f11e76]:
    - text: The bodies are not one F* module, and that is not a tidiness choice. A single module holding all of them reaches a
    - strong [ref=f11e77]: 66 GB peak memory footprint
    - text: and is killed; four hundred of the same bodies verify in
    - strong [ref=f11e78]: 4.9 seconds using 300 MB
    - text: . Verification cost is sharply superlinear in module size, so the generator emits parts and the checker runs one module per process, because F* does not release much between modules within one invocation.
  - paragraph [ref=f11e79]:
    - text: The same bodies are emitted a second time, one module per function, under
    - code [ref=f11e80]: build/fstar/fn/
    - text: ". Not a copy to keep in step: both layouts are rendered from the same tree by the same renderer in the same pass. They exist for different jobs."
  - table [ref=f11e81]:
    - rowgroup [ref=f11e82]:
      - row [ref=f11e83]:
        - columnheader [ref=f11e84]
        - columnheader [ref=f11e85]:
          - text: parts, in
          - code [ref=f11e86]: src/fstar/
        - columnheader [ref=f11e87]:
          - text: per function, in
          - code [ref=f11e88]: build/fstar/fn/
    - rowgroup [ref=f11e89]:
      - row [ref=f11e90]:
        - cell "what it is for" [ref=f11e91]
        - cell "extracting to OCaml" [ref=f11e92]
        - cell "verifying" [ref=f11e93]
      - row [ref=f11e94]:
        - cell "why" [ref=f11e95]
        - cell "linking ten OCaml modules is far faster than linking 3,676" [ref=f11e96]
        - cell "a body F* cannot check fails on its own instead of taking four hundred with it" [ref=f11e97]
      - row [ref=f11e98]:
        - cell "incrementality" [ref=f11e99]
        - cell "a part re-checks when any body in it changes" [ref=f11e100]
        - cell "a function re-checks when its own body changes" [ref=f11e101]
      - row [ref=f11e102]:
        - cell "parallelism" [ref=f11e103]
        - cell "ten" [ref=f11e104]
        - cell "as many as there are functions" [ref=f11e105]
  - paragraph [ref=f11e106]:
    - text: "Per-function verification is parallel because there is nothing to order: a call in a body is a ZID"
    - emphasis [ref=f11e107]: number
    - text: the evaluator resolves at run time, not a module reference. Every function module depends on
    - code [ref=f11e108]: Wikifn.Eval
    - text: and on nothing else, so they can be checked in any order and on any number of machines.
  - code [ref=f11e110]: "make fstar-check # the parts, in dependency order, one process each make fstar-verify-functions # every function on its own, in parallel, with a per-function report"
  - paragraph [ref=f11e111]: "Measured on a six-core machine, from cold:"
  - table [ref=f11e112]:
    - rowgroup [ref=f11e113]:
      - row [ref=f11e114]:
        - columnheader [ref=f11e115]
        - columnheader "time" [ref=f11e116]
    - rowgroup [ref=f11e117]:
      - row [ref=f11e118]:
        - cell [ref=f11e119]:
          - code [ref=f11e120]: make fstar-check
          - text: ", 24 modules"
        - cell "57 s" [ref=f11e121]
      - row [ref=f11e122]:
        - cell [ref=f11e123]:
          - code [ref=f11e124]: make fstar-verify-functions
          - text: ", 3,676 functions"
        - cell "183 s wall, 18.3 min CPU, median 0.28 s each" [ref=f11e125]
  - paragraph [ref=f11e126]:
    - text: "The per-function pass costs about twenty times the CPU and finishes in three times the wall clock, because it is six ways parallel and would be more on a bigger machine. That trade is the point: it is the pass that scales out and the pass that tells you"
    - emphasis [ref=f11e127]: which
    - text: function is the problem.
    - code [ref=f11e128]: make fstar-check
    - text: remains the one that gates extraction.
  - paragraph [ref=f11e129]:
    - text: This is also how a body that cannot be checked at all gets found rather than guessed at.
    - code [ref=f11e130]: Z24460 is Extended_Pictographic codepoint
    - text: carries the whole Unicode Extended_Pictographic table inline as a codepoint list — 164 KB in a single term. On its own, in its own module, it reaches 7.95 GB and is killed, while a 32 KB body of the same shape verifies in 2.5 seconds. The limit is the size of one term, not the size of the module, so no amount of splitting helps. The generator skips a body over 64 KB and records the reason.
  - heading "Reach" [level=2] [ref=f11e131]
  - paragraph [ref=f11e132]:
    - text: Measured with
    - code [ref=f11e133]: make closure
    - text: "(a fixpoint over the call graph, not a per-seed walk):"
  - table [ref=f11e134]:
    - rowgroup [ref=f11e135]:
      - row [ref=f11e136]:
        - columnheader [ref=f11e137]
        - columnheader "count" [ref=f11e138]
    - rowgroup [ref=f11e139]:
      - row [ref=f11e140]:
        - cell "functions in the corpus" [ref=f11e141]
        - cell "4,970" [ref=f11e142]
      - row [ref=f11e143]:
        - cell "closing over the engine's primitives, no recursion needed" [ref=f11e144]
        - cell "937" [ref=f11e145]
      - row [ref=f11e146]:
        - cell "closing over the engine's primitives, needing recursion" [ref=f11e147]
        - cell "1,167" [ref=f11e148]
      - row [ref=f11e149]:
        - cell "translated into F* and verified" [ref=f11e150]
        - cell [ref=f11e151]:
          - strong [ref=f11e152]: 3,676
      - row [ref=f11e153]:
        - cell "of those, runnable today" [ref=f11e154]
        - cell [ref=f11e155]:
          - strong [ref=f11e156]: 1,316
      - row [ref=f11e157]:
        - cell "skipped by the translator, with reasons recorded" [ref=f11e158]
        - cell "222" [ref=f11e159]
  - paragraph [ref=f11e160]: "A function is emitted whether or not everything it calls is implemented. Calls are by reference: the evaluator looks a body up when the call happens, so a function that reaches a gap still evaluates until it gets there, reports a missing implementation, and starts working the moment the gap is filled. Only the runnable count claims anything today."
  - paragraph [ref=f11e161]:
    - text: "Recursion is not a barrier for the interpreter: fuel bounds it uniformly, so the 699 recursive functions come along with the rest. Recursion"
    - emphasis [ref=f11e162]: is
    - text: a barrier for compiling a composition into a standalone F* function, because that needs a termination measure per function. This is why the interpreter path scales and the direct-compilation path does not.
  - heading "Evidence it is right" [level=2] [ref=f11e163]
  - paragraph [ref=f11e164]:
    - code [ref=f11e165]: make engine-testers
    - text: runs every Wikifunctions tester (
    - code [ref=f11e166]: Z20
    - text: ") whose call and expected value this harness can read:"
