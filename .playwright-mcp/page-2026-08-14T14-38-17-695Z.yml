  - generic [ref=f1e18]:
    - heading "Why canals" [level=2] [ref=f1e19]
    - paragraph [ref=f1e20]:
      - text: A canal is a passage you can transit in either direction and arrive at the same canal. A palindrome is a string you can read in either direction and arrive at the same string. The Panama Canal is the one place where those two facts meet, because of Leigh Mercer's
      - emphasis [ref=f1e21]: "A man, a plan, a canal: Panama"
      - text: — which is a palindrome only once you throw away the spaces and punctuation.
    - paragraph [ref=f1e22]:
      - text: So the dataset below is waterways, each with a phrase, and the query asks which phrases are palindromes after their spaces are removed. That is two Wikifunctions composed inside a
      - code [ref=f1e23]: FILTER
      - text: ":"
      - code [ref=f1e24]: Z10052
      - text: remove regular spaces, then
      - code [ref=f1e25]: Z10096
      - text: is a palindrome. Neither was written here; both come from the corpus with a revision and a digest.
  - generic [ref=f1e26]:
    - heading "Run it" [level=2] [ref=f1e27]
    - status [ref=f1e28]: Ready. Both engines are running in this page.
    - generic [ref=f1e29]:
