  - generic [ref=e17]:
    - heading "What this is and is not" [level=2] [ref=e18]
    - list [ref=e19]:
      - listitem [ref=e20]:
        - text: Each body is a mechanical translation of a pinned
        - code [ref=e21]: Z14K2
        - text: composition. None of it was written by hand, and each carries the revision and digest it came from.
      - listitem [ref=e22]:
        - text: The primitives underneath
        - emphasis [ref=e23]: are
        - text: written by hand, in F*. They are a claim about what Wikifunctions means, checked against Wikifunctions' own testers rather than proved.
      - listitem [ref=e24]: "A function marked runnable has every function it reaches implemented. Being runnable is not the same as being verified: only the tester results in the engine notes support correctness claims."
      - listitem [ref=e25]: Arguments are literal values. There is no object store, so a reference is refused rather than read as text.
      - listitem [ref=e26]:
        - text: Some compositions are defined in terms of each other with no base case.
        - code [ref=e27]: Z844
        - text: boolean equality is
        - code [ref=e28]: not(inequality)
        - text: while inequality is
        - code [ref=e29]: not(equality)
        - text: ; reversing a list is defined through appending to one, which is defined through reversing. Where another implementation escapes the cycle the generator picks it, and where the wiki's own evaluator escapes by preferring a code implementation the function is grounded in the kernel instead. What is left reports a depth limit rather than returning an answer.
      - listitem [ref=e30]:
        - text: Each function shows its declared argument and return types. Those come from the pinned
        - code [ref=e31]: Z8
        - text: and are
        - emphasis [ref=e32]: not
        - text: "checked: the engine has no type checker, so they say what the function was declared to want, not what it enforces."
      - listitem [ref=e33]:
        - text: "Fuel is a budget for total evaluation steps, not a depth limit. Running out is reported, not hidden. Naively recursive functions can need a lot: the corpus's Fibonacci needs about 200,000 steps for"
        - code [ref=e34]: n = 20
        - text: ", because it is written without memoisation."
