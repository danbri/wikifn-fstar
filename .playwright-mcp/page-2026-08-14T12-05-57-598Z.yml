  - generic [ref=f13e70]:
    - heading "How the binding works" [level=2] [ref=f13e71]
    - paragraph [ref=f13e72]:
      - text: Comunica takes an
      - code [ref=f13e73]: extensionFunctionCreator
      - text: ": given the IRI of an unknown function, return something callable or"
      - code [ref=f13e74]: undefined
      - text: . That is the whole integration, and it is why every ZID works rather than a chosen few.
    - code [ref=f13e76]: "import * as wikifn from \"./generated/js/Z10096-Z10052-Z10627.js\"; const engine = new Comunica.QueryEngine(); await engine.queryBindings(query, { sources: [{ type: \"serialized\", value: turtle, mediaType: \"text/turtle\" }], // Any <.../fn#Znnnn> the module exports becomes callable from SPARQL. extensionFunctionCreator: (iri) => { const zid = /#(Z[1-9][0-9]*)$/.exec(iri.value)?.[1]; const fn = zid && wikifn[zid]; if (!fn) return undefined; return (args) => toTerm(fn(...args.map(fromTerm))); } });"
    - paragraph [ref=f13e77]:
      - text: "The two conversions are the only real work: SPARQL passes RDF terms and the engine takes JSON literals, so a"
      - code [ref=f13e78]: xsd:string
      - text: becomes a string, an
      - code [ref=f13e79]: xsd:integer
      - text: a natural number,
      - code [ref=f13e80]: xsd:boolean
      - text: a boolean, and the result envelope (
      - code [ref=f13e81]: Z6
      - text: text,
      - code [ref=f13e82]: Z40
      - text: boolean,
      - code [ref=f13e83]: Z13518
      - text: natural number) converts back. Anything else is refused rather than guessed at.
  - generic [ref=f13e84]:
    - heading "What this is and is not" [level=2] [ref=f13e85]
    - list [ref=f13e86]:
      - listitem [ref=f13e87]: The Wikifunctions side is the same artifact the engine browser runs, checked by F* and measured against Wikifunctions' own testers. The SPARQL side is stock Comunica; nothing about it is modified.
      - listitem [ref=f13e88]: A function that is not runnable, or that reaches a group of compositions defined through each other with no base case, will report that rather than return a value. The error surfaces as a SPARQL error, not as a wrong answer.
      - listitem [ref=f13e89]: Only strings, natural numbers and booleans cross the boundary today. Lists and records exist in the engine but have no obvious RDF term, so they are refused.
      - listitem [ref=f13e90]: This is a demonstration that the extraction is usable from an unrelated host, not a proposal for how Wikidata should call Wikifunctions.
  - generic [ref=f13e91]:
    - heading "The dataset" [level=2] [ref=f13e92]
    - paragraph [ref=f13e93]: Six waterways and a phrase each, as Turtle. Editable is not the point; it is here so the query is readable.
    - generic [ref=f13e94]: "@prefix : <https://example.org/waterway#> . @prefix xsd: <http://www.w3.org/2001/XMLSchema#> . :panama :name \"Panama Canal\" ; :country \"Panama\" ; :opened 1914 ; :joins \"Atlantic and Pacific\" ; :phrase \"a man a plan a canal panama\" . :suez :name \"Suez Canal\" ; :country \"Egypt\" ; :opened 1869 ; :joins \"Mediterranean and Red Sea\" ; :phrase \"a man a plan a canal suez\" . :corinth :name \"Corinth Canal\" ; :country \"Greece\" ; :opened 1893 ; :joins \"Ionian and Aegean\" ; :phrase \"no devil lived on\" . :kiel :name \"Kiel Canal\" ; :country \"Germany\" ; :opened 1895 ; :joins \"North Sea and Baltic\" ; :phrase \"never odd or even\" . :erie :name \"Erie Canal\" ; :country \"United States\" ; :opened 1825 ; :joins \"Hudson and Lake Erie\" ; :phrase \"erie canal\" . :grand :name \"Grand Canal\" ; :country \"China\" ; :opened 609 ; :joins \"Yellow and Yangtze\" ; :phrase \"was it a rat i saw\" ."