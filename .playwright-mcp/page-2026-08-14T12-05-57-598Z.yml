    - paragraph [ref=f13e4]: wikifn-fstar
    - heading "Wikifunctions as SPARQL extension functions" [level=1] [ref=f13e5]
    - paragraph [ref=f13e6]:
      - text: A SPARQL 1.1 engine (
      - link "Comunica" [ref=f13e7] [cursor=pointer]:
        - /url: https://comunica.dev/
      - text: ", loaded from a CDN) querying a small local dataset, where the functions in the"
      - code [ref=f13e8]: FILTER
      - text: and
      - code [ref=f13e9]: BIND
      - text: clauses are real Wikifunctions. Both engines run in this page. Nothing is sent anywhere.
    - paragraph [ref=f13e10]:
      - text: The Wikifunctions side is
      - strong [ref=f13e11]: 8 KB
      - text: ", not the 1.2 MB engine:"
      - link [ref=f13e12] [cursor=pointer]:
        - /url: ./generated/js/Z10096-Z10052-Z10627.js
        - code [ref=f13e13]: Z10096-Z10052-Z10627.js
      - text: is just these three functions and their transitive closure — fifteen translated definitions and the primitives they reach. It is a plain ES module, so this page
      - code [ref=f13e14]: import
      - text: s it and nothing else.
    - paragraph [ref=f13e15]:
      - text: Those bodies are mechanical translations of the same s-expressions the checked F* printer produces, and every one is checked against the F*-extracted engine on its own Wikifunctions testers before shipping (
      - code [ref=f13e16]: node scripts/export-js.js Z10096 --check
      - text: ). The primitives underneath are written in JavaScript rather than extracted — the same second-implementation trade the Scheme export already makes, and the reason the check exists.
