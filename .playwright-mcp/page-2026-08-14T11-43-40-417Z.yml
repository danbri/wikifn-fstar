  - paragraph [ref=f11e201]: A tester is only counted as passing when both its call and its expected value were readable. Everything else is skipped with a stated reason, never counted as a pass.
  - paragraph [ref=f11e202]: "The largest remaining buckets are honest limits, not silence:"
  - list [ref=f11e203]:
    - listitem [ref=f11e204]: 2,926 testers pass an argument this harness cannot convert to a literal
    - listitem [ref=f11e205]: 3,122 have a validator this engine cannot run
    - listitem [ref=f11e206]: 880 report a depth limit, from compositions defined through each other with no base case
    - listitem [ref=f11e207]:
      - text: 519 use
      - code [ref=f11e208]: Z889
      - text: list equality with both arguments supplied, so the expected value cannot be inferred
    - listitem [ref=f11e209]: 60 disagree and are worth individual investigation
  - paragraph [ref=f11e210]:
    - text: Not every disagreement is this engine's fault, and saying which is which matters.
    - code [ref=f11e211]: Z15391 nth Fibonacci number of order k
    - text: returns 24 where its tester wants 81, because the pinned composition it was translated from writes the literal 3 where
    - emphasis [ref=f11e212]: k
    - text: belongs. The translation is faithful; the implementation is wrong. See the note on implementation choice below.
  - heading "Names" [level=2] [ref=f11e213]
  - paragraph [ref=f11e214]: "Generated names put the identifier first and the English label after it:"
  - code [ref=f11e216]: (define (Z22294_devanagari_numerals_to_arabic_numerals a0) (Z14613_replace_character_set a0 "०१२३४५६७८९" "0123456789"))
  - paragraph [ref=f11e217]: The first token maps back to plain Wikifunctions identifiers mechanically, so the text is readable without becoming unfaithful. Labels come from the pinned snapshot and are therefore stable. English is used here; the dump carries other languages and the scheme works unchanged for any of them.
  - heading "Evaluation order" [level=2] [ref=f11e218]
  - paragraph [ref=f11e219]: Fuel is a budget for total work, not a limit on nesting depth. Passing the same fuel down every branch bounds how deep evaluation goes but says nothing about how wide it goes, so a naive Fibonacci with a depth of thirty can make millions of calls and never run out. The remaining budget is threaded through every result, so the total number of steps is bounded by what the caller supplied.
  - paragraph [ref=f11e220]: Primitives are bounded too. Exponentiation and Unicode ranges would otherwise be a way to spend arbitrary time inside one call without spending any fuel.
  - paragraph [ref=f11e221]:
    - text: Arguments are evaluated once, bound into an environment, and referred to by index. The earlier evaluator substituted argument
    - emphasis [ref=f11e222]: expressions
    - text: into composition bodies, so a body mentioning an argument twice evaluated it twice, costing 2^depth when such calls nest — measured at 9.8 seconds for 26 nested
    - code [ref=f11e223]: Z11082
    - text: calls.
  - paragraph [ref=f11e224]:
    - code [ref=f11e225]: Z802
    - text: "remains lazy in its branches. This is not a preference: 230 of the 288 directly self-recursive compositions in the corpus guard their recursive branch with"
    - code [ref=f11e226]: Z802
    - text: ", so a strict"
    - code [ref=f11e227]: Z802
    - text: would make all of them diverge.
  - paragraph [ref=f11e228]: Evaluating arguments eagerly can spend fuel a lazy evaluator would not. That shows up as fuel exhaustion, which is loud, rather than as a wrong answer, which is not.
  - heading "Commands" [level=2] [ref=f11e229]
  - code [ref=f11e231]: "make closure # how far the current primitive set reaches node scripts/find-expansion-cycles.js # groups that must be grounded, not expanded node scripts/export-scheme.js Z38114 --call '\"de les chats\"' # self-contained Scheme make fstar-generate-eval # regenerate the composition bodies from the pinned cache make fstar-check # verify every F* module, one process each make fstar-verify-functions # verify every function on its own, in parallel make fstar-engine # extract to OCaml, compile to JavaScript make engine-testers # check against Wikifunctions' own testers node --test # includes engine and tester regression tests"
  - heading "Names, and hints inside them" [level=2] [ref=f11e232]
  - paragraph [ref=f11e233]:
    - text: A generated name is the ZID followed by the English label. Only the ZID is the identity; the rest is a hint for whoever is reading, and it changes when someone relabels the function on the wiki. So the Scheme listing binds each definition twice — under its full name and under its bare ZID — and
    - code [ref=f11e234]: wikifn-hints.scm
    - text: supplies a
    - code [ref=f11e235]: wikifn
    - text: macro that rewrites any
    - code [ref=f11e236]: Znnnn_...
    - text: name in its body down to
    - code [ref=f11e237]: Znnnn
    - text: "before compiling, so you can write a hint nobody generated:"
  - code [ref=f11e239]: (load "wikifn-hints.scm") (load "wikifn-bundle.scm") (Z10627_rot13_latin_alphabet "Hello") ; the generated name (Z10627 "Hello") ; the identity alone (wikifn (Z10627_shift_each_letter_by_13 "Hello")) ; a hint of your own
  - paragraph [ref=f11e240]:
    - text: "The rewrite happens at expansion time, so a hint costs nothing at run time. Outside Scheme it is one substitution:"
    - code [ref=f11e241]: s/\(Z[0-9][0-9]*\)_[A-Za-z0-9_]*/\1/g
    - text: .
  - heading "Calling it from JavaScript" [level=2] [ref=f11e242]
  - paragraph [ref=f11e243]:
    - code [ref=f11e244]: make fstar-engine
    - text: extracts the F* to OCaml, compiles that, and runs
    - code [ref=f11e245]: js_of_ocaml
    - text: "twice:"
    - code [ref=f11e246]: docs/generated/wikifn_engine.cjs
    - text: for Node and
    - code [ref=f11e247]: wikifn_engine.js
    - text: for the browser. Both export the same two functions, and that is the whole interface. They take and return strings because that is what crosses the
    - code [ref=f11e248]: js_of_ocaml
    - text: boundary cleanly.
  - code [ref=f11e250]: "require(\"./docs/generated/wikifn_engine.cjs\"); // wikifnEngineCall(zid, fuel, jsonArgs) -> JSON string const out = globalThis.wikifnEngineCall(\"Z22294\", \"5000\", JSON.stringify([\"१२३\"])); // {\"ok\":true,\"zid\":\"Z22294\",\"fuel\":5000,\"result\":{\"type\":\"Z6\",\"text\":\"123\"}} // wikifnEngineSource(zid, arity, nameTable) -> JSON string // Rendered by Wikifn.Print, the same checked module the evaluator uses."
  - paragraph [ref=f11e251]:
    - code [ref=f11e252]: examples/node-engine.js
    - text: "wraps that for the command line: it prints the declared signature, the composition as an s-expression, and then the answer."
  - code [ref=f11e254]: "node examples/node-engine.js Z10627 \"Hello, Wikifunctions!\" node examples/node-engine.js Z22294 \"१२३४५\" node examples/node-engine.js Z12668 '[1,2,3]' # a kernel primitive node examples/node-engine.js --fuel 500 Z10627 hi # running out is reported node examples/node-engine.js --find reverse"
  - code [ref=f11e256]: "Z10627 ROT13 (Latin alphabet) Z10627K1: String -> String (declared, not checked) from implementation Z13471 revision 133906 (define (Z10627_rot13_latin_alphabet a0) (Z12812_caesar_cipher_latin_alphabet a0 13)) call Z10627(\"Hello, Wikifunctions!\") fuel 100000 {\"type\":\"Z6\",\"text\":\"Uryyb, Jvxvshapgvbaf!\"}"
  - paragraph [ref=f11e257]:
    - text: Composing two of them is ordinary JavaScript, because once the envelope is unwrapped a Wikifunctions function is an ordinary call. The classic palindrome is only a palindrome once the spaces are gone, so it is
    - code [ref=f11e258]: Z10096
    - text: after
    - code [ref=f11e259]: Z10052
    - text: ":"
  - code [ref=f11e261]: node examples/compose.js
  - code [ref=f11e263]: "\"a man a plan a canal panama\" literally false spaces removed \"amanaplanacanalpanama\" then true \"amanaplanacanalpanama\" literally true spaces removed \"amanaplanacanalpanama\" then true"
  - paragraph [ref=f11e264]:
    - code [ref=f11e265]: Z10096
    - text: "compares codepoints, so it is case-sensitive:"
    - code [ref=f11e266]: neveroddoreven
    - text: is a palindrome and
    - code [ref=f11e267]: Neveroddoreven
    - text: is not. That is what the corpus function does, not a limitation of this engine. Case folding would be one more composition,
    - code [ref=f11e268]: Z10047
    - text: to lowercase, which is not implemented yet.
  - paragraph [ref=f11e269]:
    - text: The browser build of the same artifact drives
    - code [ref=f11e270]: docs/demo-engine.html
    - text: ", which is the searchable catalogue with a run form."
  - heading "Known limits" [level=2] [ref=f11e271]
  - list [ref=f11e272]:
    - listitem [ref=f11e273]: No references. Arguments are literal values; the engine has no object store, and a ZID-shaped string is refused rather than read as text.
    - listitem [ref=f11e274]:
      - text: No errors (
      - code [ref=f11e275]: Z5
      - text: ) as values, and no quoting. Records exist now; these do not.
    - listitem [ref=f11e276]:
      - text: "Implementation choice is made without any notion of correctness. A function can have several composition implementations and they are not interchangeable for a tool that follows them transitively: ROT13 has one written as thirteen nested rot1 calls that does not evaluate here, and"
      - code [ref=f11e277]: Z844
      - text: boolean equality has one defined as not(inequality) while
      - code [ref=f11e278]: Z10237
      - text: inequality is defined as not(equality). The generator translates every candidate and prefers one that runs and stays out of a mutual-recursion cycle — but not one that gets the right answer.
      - code [ref=f11e279]: Z15391 nth Fibonacci number of order k
      - text: is a faithful translation of an implementation that hardcodes 3 where
      - emphasis [ref=f11e280]: k
      - text: belongs, so it computes tribonacci whatever
      - emphasis [ref=f11e281]: k
      - text: you pass, and its own testers say so.
    - listitem [ref=f11e282]:
      - text: "Some cycles cannot be escaped by choosing differently, and are grounded in the kernel instead: arithmetic, and reversing and appending a list. That is what the wiki's own evaluator does when it prefers a code implementation, so it restores what Wikifunctions computes rather than changing it. Each one is named in"
      - code [ref=f11e283]: Wikifn.Eval
      - text: with the reason.
    - listitem [ref=f11e284]: Deep recursion exhausts fuel before it produces an answer. The evaluator is not tail-recursive after extraction.
    - listitem [ref=f11e285]: One body cannot be checked at all. See the section on splitting above.
    - listitem [ref=f11e286]:
      - text: The s-expression printer recurses over the body, so a deep enough body exhausts the
      - emphasis [ref=f11e287]: JavaScript
      - text: stack before F* notices anything.
      - code [ref=f11e288]: Z33163
      - text: does; it is counted and named rather than allowed to end the export.
    - listitem [ref=f11e289]:
      - code [ref=f11e290]: Wikifn.Model.has_type
      - text: is still assumed. The catalogue and the listing now carry each function's declared argument and return types, read from the pinned
      - code [ref=f11e291]: Z8
      - text: — but nothing checks them, so they are documentation. A wrong one is a wrong comment, not a wrong answer.
  - heading "What to do next, in order" [level=2] [ref=f11e292]
  - paragraph [ref=f11e293]:
    - text: "Ranked by what the measurements say, not by what is interesting. The two counts are different questions:"
    - emphasis [ref=f11e294]: testers
    - text: is how much evidence a change buys,
    - emphasis [ref=f11e295]: closure
    - text: is how many functions it makes reachable at all.
  - list [ref=f11e296]:
    - listitem [ref=f11e297]:
      - strong [ref=f11e298]: Errors as values, and the functions around them
      - text: —
      - code [ref=f11e299]: Z5
      - text: ","
