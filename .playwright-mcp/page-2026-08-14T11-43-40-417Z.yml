  - heading "The Wikifn Engine" [level=1] [ref=f11e6]
  - paragraph [ref=f11e7]: An extracted F* interpreter carrying 3,676 real Wikifunctions compositions.
  - heading "What is generated and what is authored" [level=2] [ref=f11e8]
  - paragraph [ref=f11e9]: This distinction matters more than any other claim on this page, so it comes first.
  - paragraph [ref=f11e10]:
