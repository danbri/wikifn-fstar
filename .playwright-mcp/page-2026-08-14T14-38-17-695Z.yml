    - paragraph [ref=f1e4]: wikifn-fstar
    - heading "Wikifunctions as SPARQL extension functions" [level=1] [ref=f1e5]
    - paragraph [ref=f1e6]:
      - text: A SPARQL 1.1 engine (
      - link "Comunica" [ref=f1e7] [cursor=pointer]:
        - /url: https://comunica.dev/
      - text: ", loaded from a CDN) querying a small local dataset, where the functions in the"
      - code [ref=f1e8]: FILTER
      - text: and
      - code [ref=f1e9]: BIND
      - text: clauses are real Wikifunctions. Both engines run in this page. Nothing is sent anywhere.
    - paragraph [ref=f1e10]: "The Wikifunctions side is the F*-extracted engine: translated from the pinned corpus into F*, checked by F*, extracted to OCaml, compiled to JavaScript. Every function it can run is available here, addressed by ZID."
    - paragraph [ref=f1e11]:
      - text: A SPARQL extension function here is a
      - strong [ref=f1e12]: compiled F* function
      - text: ", not a tree walk. Each of 1,369 compositions is an F* definition that F* checks and that extracts to an OCaml function and then a JavaScript one, so"
      - code [ref=f1e13]: fn:Z10096(...)
      - text: in a query below is a function call. Where a ZID has no compiled function the page falls back to the interpreter and says so in the result, rather than quietly answering from a different path.
