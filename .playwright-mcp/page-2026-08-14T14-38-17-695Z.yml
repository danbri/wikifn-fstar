  - generic [ref=f1e67]:
    - heading "How the binding works" [level=2] [ref=f1e68]
    - paragraph [ref=f1e69]:
      - text: Comunica takes an
      - code [ref=f1e70]: extensionFunctionCreator
      - text: ": given the IRI of an unknown function, return something callable or"
      - code [ref=f1e71]: undefined
      - text: . That is the whole integration, and it is why every ZID works rather than a chosen few.
    - code [ref=f1e73]: "const engine = new Comunica.QueryEngine(); await engine.queryBindings(query, { sources: [{ type: \"serialized\", value: turtle, mediaType: \"text/turtle\" }], // Any <.../fn#Znnnn> becomes a call to the compiled F* function for it. extensionFunctionCreator: (iri) => { const zid = /#(Z[1-9][0-9]*)$/.exec(iri.value)?.[1]; if (!zid) return undefined; return (args) => toTerm(JSON.parse(globalThis.wikifnCompiledCall( zid, JSON.stringify(args.map(fromTerm))))); } });"
    - paragraph [ref=f1e74]:
      - text: "The two conversions are the only real work: SPARQL passes RDF terms and the engine takes JSON literals, so a"
      - code [ref=f1e75]: xsd:string
      - text: becomes a string, an
      - code [ref=f1e76]: xsd:integer
      - text: a natural number,
      - code [ref=f1e77]: xsd:boolean
      - text: a boolean, and the result envelope (
      - code [ref=f1e78]: Z6
      - text: text,
      - code [ref=f1e79]: Z40
      - text: boolean,
      - code [ref=f1e80]: Z13518
      - text: natural number) converts back. Anything else is refused rather than guessed at.
  - generic [ref=f1e81]:
    - heading "What this is and is not" [level=2] [ref=f1e82]
    - list [ref=f1e83]:
      - listitem [ref=f1e84]: The Wikifunctions side is the same artifact the engine browser runs, checked by F* and measured against Wikifunctions' own testers. The SPARQL side is stock Comunica; nothing about it is modified.
      - listitem [ref=f1e85]: Compiled and interpreted must give the same answer, and a test requires it on every argument the corpus's own testers supply. The compiled path is not a faster approximation of the other one.
      - listitem [ref=f1e86]: A function that is not runnable, or that reaches a group of compositions defined through each other with no base case, will report that rather than return a value. The error surfaces as a SPARQL error, not as a wrong answer.
      - listitem [ref=f1e87]: Only strings, natural numbers and booleans cross the boundary today. Lists and records exist in the engine but have no obvious RDF term, so they are refused.
      - listitem [ref=f1e88]: This is a demonstration that the extraction is usable from an unrelated host, not a proposal for how Wikidata should call Wikifunctions.
  - generic [ref=f1e89]:
    - heading "The dataset" [level=2] [ref=f1e90]
    - paragraph [ref=f1e91]: Six waterways and a phrase each, as Turtle. Editable is not the point; it is here so the query is readable.
    - generic [ref=f1e92]: "@prefix : <https://example.org/waterway#> . @prefix xsd: <http://www.w3.org/2001/XMLSchema#> . :panama :name \"Panama Canal\" ; :country \"Panama\" ; :opened 1914 ; :joins \"Atlantic and Pacific\" ; :phrase \"a man a plan a canal panama\" . :suez :name \"Suez Canal\" ; :country \"Egypt\" ; :opened 1869 ; :joins \"Mediterranean and Red Sea\" ; :phrase \"a man a plan a canal suez\" . :corinth :name \"Corinth Canal\" ; :country \"Greece\" ; :opened 1893 ; :joins \"Ionian and Aegean\" ; :phrase \"no devil lived on\" . :kiel :name \"Kiel Canal\" ; :country \"Germany\" ; :opened 1895 ; :joins \"North Sea and Baltic\" ; :phrase \"never odd or even\" . :erie :name \"Erie Canal\" ; :country \"United States\" ; :opened 1825 ; :joins \"Hudson and Lake Erie\" ; :phrase \"erie canal\" . :grand :name \"Grand Canal\" ; :country \"China\" ; :opened 609 ; :joins \"Yellow and Yangtze\" ; :phrase \"was it a rat i saw\" ."