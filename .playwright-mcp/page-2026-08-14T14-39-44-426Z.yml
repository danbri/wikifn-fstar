    - textbox [ref=f3e35]: "# Which phrases read the same in both directions, like the # canal they name? Two Wikifunctions, composed: # Z10052 remove regular spaces # Z10096 is a palindrome PREFIX : <https://example.org/waterway#> PREFIX fn: <https://wikifunctions.org/fn#> SELECT ?name ?phrase ?palindrome WHERE { ?w :name ?name ; :phrase ?phrase . BIND(fn:Z10096(fn:Z10052(?phrase)) AS ?palindrome) } ORDER BY DESC(?palindrome) ?name"
