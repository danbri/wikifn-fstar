  - generic [ref=e18]:
    - heading "Why canals" [level=2] [ref=e19]
    - paragraph [ref=e20]:
      - text: A canal is a passage you can transit in either direction and arrive at the same canal. A palindrome is a string you can read in either direction and arrive at the same string. The Panama Canal is the one place where those two facts meet, because of Leigh Mercer's
      - emphasis [ref=e21]: "A man, a plan, a canal: Panama"
      - text: — which is a palindrome only once you throw away the spaces and punctuation.
    - paragraph [ref=e22]:
      - text: So the dataset below is waterways, each with a phrase, and the query asks which phrases are palindromes after their spaces are removed. That is two Wikifunctions composed inside a
      - code [ref=e23]: FILTER
      - text: ":"
      - code [ref=e24]: Z10052
      - text: remove regular spaces, then
      - code [ref=e25]: Z10096
      - text: is a palindrome. Neither was written here; both come from the corpus with a revision and a digest.
  - generic [ref=e26]:
    - heading "Run it" [level=2] [ref=e27]
    - status [ref=e28]: Ready. Both engines are running in this page.
    - generic [ref=e29]:
      - button "Palindrome canals" [pressed] [ref=e30] [cursor=pointer]
      - button "Filter to just those" [ref=e31] [cursor=pointer]
      - button "Any ZID you like" [ref=e32] [cursor=pointer]
      - button "Mixed with plain SPARQL" [ref=e33] [cursor=pointer]
    - textbox [ref=e34]: "# Which phrases read the same in both directions, like the # canal they name? Two Wikifunctions, composed: # Z10052 remove regular spaces # Z10096 is a palindrome PREFIX : <https://example.org/waterway#> PREFIX fn: <https://wikifunctions.org/fn#> SELECT ?name ?phrase ?palindrome WHERE { ?w :name ?name ; :phrase ?phrase . BIND(fn:Z10096(fn:Z10052(?phrase)) AS ?palindrome) } ORDER BY DESC(?palindrome) ?name"
