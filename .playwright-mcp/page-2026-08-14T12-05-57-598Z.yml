  - generic [ref=f13e21]:
    - heading "Why canals" [level=2] [ref=f13e22]
    - paragraph [ref=f13e23]:
      - text: A canal is a passage you can transit in either direction and arrive at the same canal. A palindrome is a string you can read in either direction and arrive at the same string. The Panama Canal is the one place where those two facts meet, because of Leigh Mercer's
      - emphasis [ref=f13e24]: "A man, a plan, a canal: Panama"
      - text: — which is a palindrome only once you throw away the spaces and punctuation.
    - paragraph [ref=f13e25]:
      - text: So the dataset below is waterways, each with a phrase, and the query asks which phrases are palindromes after their spaces are removed. That is two Wikifunctions composed inside a
      - code [ref=f13e26]: FILTER
      - text: ":"
      - code [ref=f13e27]: Z10052
      - text: remove regular spaces, then
      - code [ref=f13e28]: Z10096
      - text: is a palindrome. Neither was written here; both come from the corpus with a revision and a digest.
  - generic [ref=f13e29]:
    - heading "Run it" [level=2] [ref=f13e30]
    - status [ref=f13e31]: Ready. Comunica plus 3 Wikifunctions (Z10052, Z10096, Z10627), both running in this page.
    - generic [ref=f13e32]:
      - button "Palindrome canals" [pressed] [ref=f13e33] [cursor=pointer]
      - button "Filter to just those" [ref=f13e34] [cursor=pointer]
      - button "Any ZID you like" [ref=f13e35] [cursor=pointer]
      - button "Mixed with plain SPARQL" [ref=f13e36] [cursor=pointer]
    - textbox [ref=f13e37]: "# Which phrases read the same in both directions, like the # canal they name? Two Wikifunctions, composed: # Z10052 remove regular spaces # Z10096 is a palindrome PREFIX : <https://example.org/waterway#> PREFIX fn: <https://wikifunctions.org/fn#> SELECT ?name ?phrase ?palindrome WHERE { ?w :name ?name ; :phrase ?phrase . BIND(fn:Z10096(fn:Z10052(?phrase)) AS ?palindrome) } ORDER BY DESC(?palindrome) ?name"
